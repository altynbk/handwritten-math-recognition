name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install runtime and tests
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies and regressions
        run: |
          python -m pip check
          python -m pytest -q
      - name: Verify the included models on the held-out test sets
        run: python -m src.evaluate --output runs/ci-verification.json
      - name: Install notebook dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-notebook.txt
      - name: Execute the walkthrough without training
        if: runner.os == 'Linux'
        run: python scripts/check_notebook.py
